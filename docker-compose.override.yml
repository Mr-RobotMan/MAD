services:
  postgres:
    volumes:
      - ./migrations/000002_notifications.up.sql:/docker-entrypoint-initdb.d/000002_notifications.up.sql:ro

  task-engine:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  training-hub:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  analytics-ml:
    build:
      context: .
      dockerfile: services/analytics-ml/Dockerfile.multistage
    container_name: mad-analytics-ml
    environment:
      PORT: "8000"
      NATS_URL: "nats://nats:4222"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile.multistage
    container_name: mad-notification
    ports:
      - "${NOTIFICATION_PORT:-8083}:8083"
    environment:
      PORT: "8083"
      DATABASE_URL: "${DATABASE_URL}"
      NATS_URL: "${NATS_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile.multistage
    container_name: mad-gateway
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      NATS_URL: "${NATS_URL}"
      TASK_ENGINE_URL: "http://task-engine:8081"
      TRAINING_HUB_URL: "http://training-hub:8082"
      NOTIFICATION_URL: "http://notification:8083"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      task-engine:
        condition: service_healthy
      training-hub:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
