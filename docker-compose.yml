services:
  task-engine:
    build:
      context: .
      dockerfile: services/task-engine/Dockerfile.multistage
    container_name: mad-task-engine
    ports:
      - "${TASK_ENGINE_PORT:-8081}:${TASK_ENGINE_PORT:-8081}"
    environment:
      PORT: "${TASK_ENGINE_PORT:-8081}"
      DATABASE_URL: "${DATABASE_URL}"
      NATS_URL: "${NATS_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: mad-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      PORT: "${PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      NATS_URL: "${NATS_URL}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - mad_postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  nats:
    image: nats:latest
    container_name: mad-nats
    command: ["-js"]
    ports:
      - "${NATS_PORT:-4222}:4222"
    environment:
      PORT: "${PORT}"
      DATABASE_URL: "${DATABASE_URL}"
      NATS_URL: "${NATS_URL}"
    healthcheck:
      test: ["CMD", "nats-server", "--version"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mad_postgres_data:
